name: dco
on:
  pull_request:
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit carries a Signed-off-by line from its author (CONTRIBUTING.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            if ! git log -1 --format=%B "$c" | grep -i '^Signed-off-by:' | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line for <$email>. Fix with: git rebase --signoff $BASE && git push --force-with-lease"
              fail=1
            fi
          done
          exit $fail
