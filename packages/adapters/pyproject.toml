[project]
name = "gap-adapters"
version = "0.1.0"
description = "Merchant adapter interface, two fake merchants of different shapes, and safe execution on a rail"
requires-python = ">=3.12"
dependencies = ["gap-core", "gap-ledger"]

[tool.uv.sources]
gap-core = { workspace = true }
gap-ledger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_adapters"]
