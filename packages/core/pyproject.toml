[project]
name = "gap-core"
version = "0.1.0"
description = "Pure core: types, Money, canonical JSON, hashing, signature verification, hash chains"
requires-python = ">=3.12"
dependencies = ["rfc8785>=0.1.4", "cryptography>=43", "tzdata>=2025.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_core"]
