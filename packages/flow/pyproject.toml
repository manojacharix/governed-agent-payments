[project]
name = "gap-flow"
version = "0.1.0"
description = "gap flow"
requires-python = ">=3.12"
dependencies = ["gap-state", "gap-core", "gap-keys", "gap-ledger", "gap-adapters", "gap-recon", "gap-profile", "gap-identity"]

[tool.uv.sources]
gap-state = { workspace = true }
gap-core = { workspace = true }
gap-keys = { workspace = true }
gap-ledger = { workspace = true }
gap-adapters = { workspace = true }
gap-recon = { workspace = true }
gap-profile = { workspace = true }
gap-identity = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_flow"]
