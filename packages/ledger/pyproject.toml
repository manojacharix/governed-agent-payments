[project]
name = "gap-ledger"
version = "0.1.0"
description = "Postgres ledger: chained records, postings, key log, verify_integrity()"
requires-python = ">=3.12"
dependencies = ["gap-core", "psycopg[binary]>=3.2", "cryptography>=43"]

[tool.uv.sources]
gap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_ledger"]
