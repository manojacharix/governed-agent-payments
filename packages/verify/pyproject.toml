[project]
name = "gap-verify"
version = "0.1.0"
description = "Open verifier: checks an evidence bundle's signatures, chains, key log and reproduces the decision, trusting no operator"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["gap-core"]

[tool.uv.sources]
gap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_verify"]
