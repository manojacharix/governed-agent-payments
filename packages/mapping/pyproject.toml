[project]
name = "gap-mapping"
version = "0.1.0"
description = "Loads jurisdiction mappings and Tier 0 configs (data, not code) into core types"
requires-python = ">=3.12"
dependencies = ["gap-core", "pyyaml>=6"]

[tool.uv.sources]
gap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_mapping"]
