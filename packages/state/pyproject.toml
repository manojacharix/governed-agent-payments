[project]
name = "gap-state"
version = "0.1.0"
description = "Durable working state (proposals, challenges, tokens, callers, recoveries) in Postgres, with units of work"
requires-python = ">=3.12"
dependencies = ["gap-core", "psycopg[binary]>=3.2"]

[tool.uv.sources]
gap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_state"]
