[project]
name = "gap-keys"
version = "0.1.0"
description = "Signers: local (development and tests); KMS later"
requires-python = ">=3.12"
dependencies = ["gap-core", "cryptography>=43"]

[tool.uv.sources]
gap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_keys"]
