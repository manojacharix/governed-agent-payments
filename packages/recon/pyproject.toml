[project]
name = "gap-recon"
version = "0.1.0"
description = "gap recon"
requires-python = ">=3.12"
dependencies = ["gap-core", "gap-ledger", "gap-adapters"]

[tool.uv.sources]
gap-core = { workspace = true }
gap-ledger = { workspace = true }
gap-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_recon"]
