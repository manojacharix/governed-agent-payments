[project]
name = "governed-agent-payments"
version = "0.0.0"
description = "Workspace root for the governed agent payments infrastructure"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gap-core = { workspace = true }
gap-keys = { workspace = true }
gap-mapping = { workspace = true }
gap-ledger = { workspace = true }
gap-profile = { workspace = true }
gap-sim = { workspace = true }
gap-adapters = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "gap-core", "gap-keys", "gap-mapping", "gap-ledger", "gap-profile", "gap-sim", "gap-adapters"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --import-mode=importlib"
