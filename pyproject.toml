[project]
name = "governed-agent-payments"
version = "0.0.0"
description = "Workspace root for the governed agent payments infrastructure"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gap-core = { workspace = true }
gap-keys = { workspace = true }
gap-mapping = { workspace = true }
gap-ledger = { workspace = true }
gap-profile = { workspace = true }
gap-sim = { workspace = true }
gap-adapters = { workspace = true }
gap-recon = { workspace = true }
gap-flow = { workspace = true }
gap-evidence = { workspace = true }
gap-identity = { workspace = true }
gap-api = { workspace = true }
gap-state = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "gap-core", "gap-keys", "gap-mapping", "gap-ledger", "gap-profile", "gap-sim", "gap-adapters", "gap-recon", "gap-flow", "gap-evidence", "gap-identity", "gap-api", "gap-state"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --import-mode=importlib"
